[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabric-tools"
version = "0.1.0"
description = "CLI for working with Microsoft Fabric artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "fabric-tools contributors" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "azure-identity>=1.17",
    "nbdime>=4",
    "nbformat>=5",
    "questionary>=2",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
]
build = [
    "pyinstaller>=6",
]

[project.scripts]
fabric-tools = "fabric_tools.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
