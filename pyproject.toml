[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fabric-tools"
version = "0.1.0"
description = "CLI for working with Microsoft Fabric artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "fabric-tools contributors" }]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "azure-identity>=1.17",
    "azure-identity-broker>=1.1",
    "nbdime>=4",
    "nbformat>=5",
    "questionary>=2",
]


[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "ruff>=0.9",
]
build = [
    "pyinstaller>=6",
]

[project.scripts]
fabric-tools = "fabric_tools.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "packaging"]
extend-exclude = [
    "build",
    "dist",
    "pytest-cache-files-*",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length; leave to formatter / human judgment
    "B008", # Typer Option/Argument defaults are intentional
    "UP042", # str+Enum is preferred over StrEnum for CLI values here
    "W291", # trailing whitespace (ASCII banner + formatter covers the rest)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
